[package]
name = "lattice_equities"
version = "0.1.0"
description = "Sealed batch auctions for tokenized stocks, cleared on Arcium"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "lattice_equities"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "arcium-anchor/idl-build", "anchor-spl/idl-build"]
anchor-debug = []
custom-heap = []
custom-panic = []
local-circuits = []

[dependencies]
anchor-lang = { version = "1.0.2", features = ["init-if-needed"] }
anchor-spl = "1.0.2"
arcium-client = { default-features = false, version = "=0.15.0" }
arcium-macros = "=0.15.0"
arcium-anchor = "=0.15.0"
solana-security-txt = "1.1.3"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }
